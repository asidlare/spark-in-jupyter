services:
  db:
    image: postgres:17-alpine
    container_name: spark-in-jupyter-db
    volumes:
      - ./data/db:/var/lib/postgresql/data
    env_file:
      - ./env_file.txt
  backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: spark-in-jupyter
    # command: tail -f /dev/null
    command: jupyter-lab --ip=0.0.0.0 --port=9000 --NotebookApp.token='' --NotebookApp.password='' --allow-root
    volumes:
      - .:/code
    ports:
      - "9000:9000"
    env_file:
      - ./env_file.txt
    depends_on:
      - db
    restart: unless-stopped

